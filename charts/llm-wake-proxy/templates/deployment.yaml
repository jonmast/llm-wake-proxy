apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-wake-proxy.fullname" . }}
  labels:
    {{- include "llm-wake-proxy.labels" . | nindent 4 }}
spec:
  # Single-replica: in-memory coordination, no HA (matches design constraint).
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "llm-wake-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-wake-proxy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "llm-wake-proxy.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30

      volumes:
        # Read-only root FS; distroless has no writable dirs except these.
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- if .Values.ssh.existingSecret }}
        - name: ssh
          secret:
            secretName: {{ .Values.ssh.existingSecret | quote }}
            defaultMode: 0600
        {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "llm-wake-proxy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: {{ .Values.proxy.listenPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "llm-wake-proxy.fullname" . }}-env
          {{- with .Values.proxy.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds:      {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold:    {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}

          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds:       {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds:      {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold:    {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/nonroot
            {{- if .Values.ssh.existingSecret }}
            - name: ssh
              mountPath: {{ .Values.ssh.mountPath | quote }}
              readOnly: true
            {{- end }}
