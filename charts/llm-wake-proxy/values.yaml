# ============================================================================
# llm-wake-proxy — bjw-s common library chart values
# ============================================================================
# Required at install time (override via -f or --set):
#   ssh.host, ssh.user, wol.macAddress, ssh.modelPath
#
# Example:
#   helm install llm-wake-proxy ./charts/llm-wake-proxy \
#     --set ssh.host=llama.tailnet.example \
#     --set ssh.user=jon \
#     --set wol.macAddress=AA:BB:CC:DD:EE:FF \
#     --set ssh.modelPath=/models/qwen2.5-7b-instruct-q4_k_m.gguf \
#     --set proxy.modelAlias=qwen2.5-7b-instruct \
#     --set controllers.main.containers.main.image.repository=ghcr.io/jonmast/llm-wake-proxy \
#     --set persistence.ssh-key.enabled=true \
#     --set persistence.ssh-key.name=llm-wake-proxy-ssh-key
# ============================================================================

# -- Proxy behaviour (mirrors README env-var table). These values are
#    referenced as Helm templates in the ConfigMap below.
proxy:
  listenPort: 3000
  modelAlias: llm-wake-proxy
  modelOwnedBy: llm-wake-proxy
  modelProviderId: llama.cpp
  embeddingsEnabled: true
  warmMaxActiveRequests: 2
  warmMaxQueuedRequests: 16
  warmQueueTimeoutSecs: 30
  coldStartMaxWaiting: 32
  coldWaitBudgetSecs: 90
  hardBootDeadlineSecs: 300
  bootstrapPollIntervalMs: 1000
  retryAfterSecs: 10

# -- Host / SSH settings.
ssh:
  host: ""              # required
  user: ""              # required
  port: 22
  helperPath: /usr/local/bin/llm-wake-proxy-helper
  modelPath: ""         # required
  tunnelLocalPort: 18080
  llamaServerPort: 8080
  existingSecret: ""    # name of existing k8s Secret (ssh-privatekey, known_hosts)
  mountPath: /home/nonroot/.ssh

# -- Wake-on-LAN.
wol:
  macAddress: ""        # required, XX:XX:XX:XX:XX:XX
  broadcastAddr: 255.255.255.255
  port: 9

# -- Container image. Users override these with --set, no deep nesting needed.
image:
  repository: ghcr.io/<your-user>/llm-wake-proxy
  # -- Image tag.  May include @sha256:... digest.  Defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

# ============================================================================
# bjw-s common library chart — https://bjw-s-labs.github.io/helm-charts
# ============================================================================

global:
  # -- (string) Override the chart name used in resource names.
  nameOverride: ""
  # -- (string) Override the fullname used in resource names.
  fullnameOverride: ""
  labels: {}

defaultPodOptions:
  # Required for Wake-on-LAN: the pod must share the node’s network
  # namespace so UDP broadcasts reach the physical LAN.
  hostNetwork: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  imagePullSecrets: []

controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate

    pod:
      annotations: {}

    containers:
      main:
        image:
          repository: "{{ .Values.image.repository }}"
          tag: "{{ .Values.image.tag | default .Chart.AppVersion }}"
          pullPolicy: IfNotPresent

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
              - ALL

        ports:
          - name: http
            containerPort: 3000
            protocol: TCP

        envFrom:
          - configMapRef:
              identifier: env

        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /healthz
            port: http
            spec:
              initialDelaySeconds: 5
              periodSeconds: 15
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            type: HTTP
            path: /healthz
            port: http
            spec:
              initialDelaySeconds: 2
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 3

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 3000
        protocol: TCP

ingress:
  main:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: llm-wake-proxy.local
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls: []

configMaps:
  env:
    data:
      PORT: "{{ .Values.proxy.listenPort }}"
      MODEL_ALIAS: "{{ .Values.proxy.modelAlias }}"
      MODEL_OWNED_BY: "{{ .Values.proxy.modelOwnedBy }}"
      MODEL_PROVIDER_ID: "{{ .Values.proxy.modelProviderId }}"
      EMBEDDINGS_ENABLED: "{{ .Values.proxy.embeddingsEnabled }}"
      WARM_MAX_ACTIVE_REQUESTS: "{{ .Values.proxy.warmMaxActiveRequests }}"
      WARM_MAX_QUEUED_REQUESTS: "{{ .Values.proxy.warmMaxQueuedRequests }}"
      WARM_QUEUE_TIMEOUT_SECS: "{{ .Values.proxy.warmQueueTimeoutSecs }}"
      COLD_START_MAX_WAITING: "{{ .Values.proxy.coldStartMaxWaiting }}"
      COLD_WAIT_BUDGET_SECS: "{{ .Values.proxy.coldWaitBudgetSecs }}"
      HARD_BOOT_DEADLINE_SECS: "{{ .Values.proxy.hardBootDeadlineSecs }}"
      BOOTSTRAP_POLL_INTERVAL_MS: "{{ .Values.proxy.bootstrapPollIntervalMs }}"
      RETRY_AFTER_SECS: "{{ .Values.proxy.retryAfterSecs }}"
      SSH_HOST: "{{ required `ssh.host is required` .Values.ssh.host }}"
      SSH_USER: "{{ required `ssh.user is required` .Values.ssh.user }}"
      SSH_PORT: "{{ .Values.ssh.port }}"
      HELPER_PATH: "{{ .Values.ssh.helperPath }}"
      MODEL_PATH: "{{ required `ssh.modelPath is required` .Values.ssh.modelPath }}"
      SSH_KEY_PATH: "{{ printf `%s/ssh-privatekey` .Values.ssh.mountPath }}"
      TUNNEL_LOCAL_PORT: "{{ .Values.ssh.tunnelLocalPort }}"
      LLAMA_SERVER_PORT: "{{ .Values.ssh.llamaServerPort }}"
      WOL_MAC_ADDRESS: "{{ required `wol.macAddress is required` .Values.wol.macAddress }}"
      WOL_BROADCAST_ADDR: "{{ .Values.wol.broadcastAddr }}"
      WOL_PORT: "{{ .Values.wol.port }}"

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  home:
    type: emptyDir
    globalMounts:
      - path: /home/nonroot
  ssh-key:
    enabled: false
    type: secret
    name: "{{ .Values.ssh.existingSecret }}"
    defaultMode: 384
    globalMounts:
      - path: "{{ .Values.ssh.mountPath }}"
        readOnly: true

serviceAccount:
  main:
    annotations: {}
